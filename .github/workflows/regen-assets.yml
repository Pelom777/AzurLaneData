name: regen-assets

# 全量重建资源（按分片并行）。**日常增量走 sync-assets.yml，不要用这个。**
#
# 什么时候用它：
#   - 首次入库 / 换桶 / 从未生成过的类别
#   - 改了渲染实现（升 UnityPy、改立绘合成）后需要按当前版本重生一遍
#   - 不想信任旧快照：本 workflow **不用 --seed**，所有产物都从当前 CDN 现取，
#     所以产出的一定是官方当前版本，而不是某个历史快照
#
# 为什么必须分批（这是本文件存在的理由）：
#   painting 全量 2,491 张 = 下载 3.7 GB + 产物 5.6 GB。托管 runner 的 / 只有
#   约 14 GB，一次跑完峰值约 9.3 GB，且中途无法回收。按 crc32(名字) % N 切成
#   N 片后，每片峰值约 1.7 GB（N=6），跑完立刻上传并删掉，磁盘占用与 N 成反比。
#   分片键用 crc32 而不是 hash()：后者按进程随机化，换一次进程分片就变了。
#
# 时间预算（实测单张 2.2s 渲染）：
#   6 片并行 ≈ 20 分钟（含安装依赖）；串行则约 2 小时。job 上限设 120 分钟，
#   任一环节超时都会先被杀掉，不会占着 runner 空转。
#
# 前置条件：public/data 必须是**当前版本**的数据。它决定 --scope used 的引用集，
#   数据旧了会漏掉新船（实测旧数据漏 333 张立绘）。不确定就先 dispatch 一次
#   update-data（force=true）把它刷新。
#
# 容量预算（R2 免费额度 10 GB）：
#   painting 5.6 GB + paintingface 0.6 GB + 图标 0.26 GB + spine 1.10 GB ≈ 7.6 GB。
#   paintingface 是随 painting 一起出的（export_painting 顺带写表情），别当成漏算。

on:
  workflow_dispatch:
    inputs:
      items:
        description: "资源类别（空格分隔）"
        default: "painting"
        type: string
      shards:
        description: "分片数（1-16；6 时每片约 1.7 GB，越大越省磁盘）"
        default: "6"
        type: string
      scope:
        description: "used=只导 public/data 引用到的；all=清单全导"
        default: used
        type: choice
        options: [used, all]
      force:
        description: "忽略 state，连未变化的也重做"
        default: false
        type: boolean
      dry_run:
        description: "只生成，不上传、不提交"
        default: false
        type: boolean

concurrency:
  group: regen-assets
  cancel-in-progress: false

permissions:
  contents: write

env:
  SERVER: CN
  PYTHONUNBUFFERED: "1"
  RCLONE_CONFIG_R2_TYPE: s3
  RCLONE_CONFIG_R2_PROVIDER: Cloudflare
  RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  RCLONE_CONFIG_R2_REGION: auto

jobs:
  # 把 "片数" 变成一个真正的矩阵数组。用 fromJSON 动态生成，而不是写死
  # [0,1,2,3,4,5]——写死的话改 shards 输入不会生效，那输入就是假的。
  prep:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.gen.outputs.shards }}
    steps:
      - name: 生成分片矩阵
        id: gen
        run: |
          N="${{ inputs.shards }}"
          case "$N" in ''|*[!0-9]*)
            echo "::error::shards 必须是整数，收到 '$N'"; exit 1 ;;
          esac
          if [ "$N" -lt 1 ] || [ "$N" -gt 16 ]; then
            echo "::error::shards 取 1..16，收到 $N"; exit 1
          fi
          echo "shards=$(python3 -c 'import json,sys;print(json.dumps(list(range(int(sys.argv[1])))))' "$N")" >> "$GITHUB_OUTPUT"

  regen:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      # 一片失败不要把其他片也掐掉：成功的片段仍有价值（state 会记录），
      # 下次 dispatch 少做一片。
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prep.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt
          python -c "import cv2, numpy, UnityPy; print('cv2', cv2.__version__, '| numpy', numpy.__version__, '| UnityPy', UnityPy.__version__)"

      - name: 安装 rclone
        run: |
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          unzip -oq /tmp/rclone.zip -d /tmp/rclone
          cp /tmp/rclone/rclone-*/rclone /usr/local/bin/rclone
          chmod +x /usr/local/bin/rclone
          rclone version | head -1

      - name: 检查 R2 凭据
        if: ${{ !inputs.dry_run }}
        run: |
          missing=""
          [ -z "$RCLONE_CONFIG_R2_ACCESS_KEY_ID" ] && missing="$missing R2_ACCESS_KEY_ID"
          [ -z "$RCLONE_CONFIG_R2_SECRET_ACCESS_KEY" ] && missing="$missing R2_SECRET_ACCESS_KEY"
          [ -z "${{ secrets.R2_ACCOUNT_ID }}" ] && missing="$missing R2_ACCOUNT_ID"
          [ -z "${{ secrets.R2_BUCKET }}" ] && missing="$missing R2_BUCKET"
          if [ -n "$missing" ]; then
            echo "::error::缺少 secrets:$missing（配置方法见 docs/CDN.md §5.1）"
            exit 1
          fi
          echo "凭据齐全，桶 = ${{ secrets.R2_BUCKET }}"

      # 磁盘先体检再开跑。跑到一半写满的失败最难查：表现是 cv2 报 IO 错、
      # 或者 png 只有半张，看不出是容量问题。
      - name: 磁盘预检
        run: |
          free=$(df -Pm / | awk 'NR==2{print $4}')
          echo "分片 ${{ matrix.shard }} 开始前可用 ${free} MB"
          if [ "$free" -lt 6000 ]; then
            echo "::error::可用磁盘 ${free} MB < 6 GB，跑一片就会写满。调大 shards 或换更大的 runner。"
            exit 1
          fi

      - name: 生成（分片 ${{ matrix.shard }}）
        id: gen
        run: |
          SHARD="${{ matrix.shard }}"
          N="${{ inputs.shards }}"
          ARGS="--server $SERVER --public public --cache .azl/bundles \
                --state .azl/state-$SHARD.json --scope ${{ inputs.scope }} \
                --items ${{ inputs.items }} --shard $SHARD/$N \
                --report-files .azl/written-$SHARD.list"
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "python scripts/azl_assets.py $ARGS"
          start=$(date +%s)
          python scripts/azl_assets.py $ARGS
          echo "耗时 $(( $(date +%s) - start ))s"
          echo "written=$(tr -cd '\0' < .azl/written-$SHARD.list | wc -c)" >> "$GITHUB_OUTPUT"

      # 用 copy 不用 sync：sync 会删远端多余对象（spine 是手工搬的，不在任何
      # 一次生成的清单里，会被一并删掉）。--ignore-times：清单已是精确变更集。
      # --s3-no-check-bucket：R2 对受限 token 的 HeadBucket 返回 403，rclone 会
      # 误判桶不存在并尝试 CreateBucket，然后整体失败。
      - name: 上传（分片 ${{ matrix.shard }}）
        if: ${{ !inputs.dry_run }}
        run: |
          SHARD="${{ matrix.shard }}"
          tr '\0' '\n' < .azl/written-$SHARD.list | sed 's|^public/||' | sed '/^$/d' \
            > .azl/upload-$SHARD.lst
          n=$(wc -l < .azl/upload-$SHARD.lst)
          echo "分片 $SHARD 待上传 $n 个对象"
          if [ "$n" -eq 0 ]; then echo "清单为空，跳过上传"; exit 0; fi
          rclone copy public "r2:${{ secrets.R2_BUCKET }}" \
            --files-from .azl/upload-$SHARD.lst \
            --ignore-times \
            --s3-no-check-bucket \
            --transfers 16 --checkers 32 \
            --header-upload "Cache-Control: public, max-age=86400" \
            --stats 15s --stats-one-line

      - name: 上报分片账目
        if: always()
        run: |
          shard="${{ matrix.shard }}"
          lst=".azl/upload-$shard.lst"
          if [ -f "$lst" ]; then queued=$(wc -l < "$lst"); else queued=-; fi
          disk=$(df -Pm / | awk 'NR==2{print $4}')
          out=$(du -sm public 2>/dev/null | awk '{print $1}')
          {
            echo "### 分片 $shard/${{ inputs.shards }}"
            echo
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 待上传对象 | ${queued} |"
            echo "| public/ 体积 | ${out:-?} MB |"
            echo "| 残留可用磁盘 | ${disk} MB |"
          } >> "$GITHUB_STEP_SUMMARY"

      # 每片的 state 单独落一个文件。不能让大家同时写同一个文件——6 个 job
      # 各写各的，最后在 merge 里合并；否则后跑的会覆盖先跑的。
      - name: 上传 state 片段
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: state-${{ matrix.shard }}
          path: .azl/state-${{ matrix.shard }}.json
          retention-days: 3
          if-no-files-found: warn

  # 合并 state 并提交一次。state 进 git 是增量链路的前提：下一轮 sync-assets
  # 靠它判断"这个资源的 md5 我已经按最新版生成过了"。
  merge:
    needs: [prep, regen]
    if: ${{ !inputs.dry_run && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 取回各片 state
        uses: actions/download-artifact@v4
        with:
          pattern: state-*
          merge-multiple: true
          path: .azl/states

      - name: 合并 state
        run: |
          python - <<'PY'
          import glob, json
          base = json.load(open('.azl/assets-state.json', encoding='utf-8'))
          n = 0
          for p in sorted(glob.glob('.azl/states/*.json')):
              frag = json.load(open(p, encoding='utf-8'))
              for srv, items in (frag.get('items') or {}).items():
                  tgt = base.setdefault('items', {}).setdefault(srv, {})
                  tgt.update(items)
                  n += len(items)
              for srv, ver in (frag.get('version') or {}).items():
                  base.setdefault('version', {})[srv] = ver
          json.dump(base, open('.azl/assets-state.json', 'w', encoding='utf-8'),
                    ensure_ascii=False, indent=1, sort_keys=True)
          total = sum(len(v) for v in base.get('items', {}).values())
          print(f'合并 {n} 条，state 共 {total} 条')
          PY

      - name: 提交 state
        run: |
          if git diff --quiet -- .azl/assets-state.json; then
            echo "state 无变化，跳过提交"
            exit 0
          fi
          python scripts/commit.py --paths .azl/assets-state.json \
            --message "assets: 全量重建 ${{ inputs.items }}（${{ inputs.shards }} 片）"
