name: p0-probe

# 阶段 0 验收专用：只解一张 weapon_name，证明 bcdec → ljd → luatable 还能走通。
# 这个 workflow 是临时的，阶段 0 结束就删；每小时流水线在 update-data.yml。
#
# 为什么要在 CI 里跑：bcdec / uabdec 是 32 位 i386 ELF，跑不动它们的机器
# （比如纯 Windows）就没法完成 P0。ubuntu-latest 是它们的原生环境，
# 而且和将来的生产环境完全一致。
#
# 证据落在 p0-artifacts 分支（不污染 master）：report.json / best.lua / weapon_name.json

on:
  push:
    paths:
      - ".github/workflows/p0-probe.yml"
      - "scripts/p0_probe.py"
      - "tests/fixtures/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # 两个二进制是静态链接的 32 位 i386 ELF（无 PT_INTERP），
      # 所以不需要 libc6:i386，只要能执行就行。
      - name: 检查工具链
        run: |
          chmod +x tools/bcdec tools/uabdec
          file tools/bcdec tools/uabdec
          tools/bcdec </dev/null >/dev/null 2>&1; echo "bcdec 返回码: $?"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt
          python -c "import ljd.tools, UnityPy; print('ljd / UnityPy 就绪')"

      - name: 运行 P0 探针
        id: probe
        continue-on-error: true
        run: |
          python scripts/p0_probe.py \
            --server CN \
            --table weapon_name \
            --work work \
            --report p0/report.json \
            --fixture tests/fixtures/weapon_name.json

      - name: 结论写入摘要
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("p0/report.json")
          if not p.exists():
              print("## P0 探针\n\n探针没有产出报告，看上一个 step 的日志。")
              raise SystemExit(0)
          r = json.loads(p.read_text("utf-8"))
          b = r.get("bundle", {})
          c = r.get("bcdec", {})
          print("## P0 探针 ·", r.get("table"), "\n")
          print(f"- 版本：`{r.get('azhash')}`")
          print(f"- bundle：{b.get('size')} 字节 / {b.get('segments')} 段 / "
                f"覆盖{'完整' if b.get('coverage_exact') else '**不完整**'} / md5 "
                f"{'一致' if b.get('md5_matches_listing') else '**不一致**'}")
          print(f"- bcdec：{c.get('segments_decoded')} 段成功 / {c.get('failures')} 段失败 / "
                f"{c.get('seconds')}s")
          print(f"- **结论：{r.get('verdict')}**")
          if r.get("fixture_compare"):
              print(f"- 与基线比对：{json.dumps(r['fixture_compare'], ensure_ascii=False)}")
          print("\n### 各假设结果\n")
          print("| 假设 | 成功 | 条目 | 说明 |")
          print("|---|---|---|---|")
          for k, v in (r.get("hypotheses") or {}).items():
              print(f"| `{k}` | {v.get('ok')} | {v.get('entries', '-')} | "
                    f"{v.get('error') or ('段 ' + str(v.get('segments_ok')) + '/' + str(v.get('segments_tried'))) or ''} |")
          PY

      # 证据推到独立分支，这样不用登录也能查看，也不污染 master
      - name: 归档证据到 p0-artifacts 分支
        if: always()
        run: |
          mkdir -p p0
          ls -la p0 || true
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c p0-artifacts
          git add -f p0
          if git diff --cached --quiet; then
            echo "没有可提交的证据"
          else
            git commit -m "p0: 探针证据 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push -f origin p0-artifacts
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-evidence
          path: p0/
          if-no-files-found: warn
