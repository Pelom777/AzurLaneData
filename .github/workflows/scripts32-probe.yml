name: scripts32-probe

# 只验证 scripts32 那条链路（uabdec → UnityPy → bcdec → ljd）的 4 张表。
# 全量 stage1 要跑 20 分钟，改 scripts32 时用这个快速迭代（约 2~3 分钟）。
# 证据归档到 p0-artifacts 分支的 scripts32/ 目录。

on:
  push:
    paths:
      - ".github/workflows/scripts32-probe.yml"
      - "scripts/unpack_lua.py"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 工具链
        run: chmod +x tools/bcdec tools/uabdec

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: python -m pip install -q -r requirements.txt

      - name: 只解 scripts32 的 4 张表
        id: run
        continue-on-error: true
        run: |
          mkdir -p out
          python scripts/unpack_lua.py --server CN --out raw32 --work work --cache .cache/lua \
            --only ship_data_strengthen,attribute_info_by_type,ship_data_trans,transform_data_template \
            2>&1 | tee out/probe.log

      - name: 汇总
        if: always()
        run: |
          python - <<'PY' | tee out/summary.txt
          import json, pathlib
          d = pathlib.Path("raw32")
          files = sorted(d.glob("*.json")) if d.exists() else []
          print(f"产出 {len(files)} 张表")
          for f in files:
              try:
                  data = json.loads(f.read_text("utf-8"))
                  keys = sorted(data)[:3]
                  print(f"  {f.name}: {len(data)} 条 / {f.stat().st_size} 字节 / 样例键 {keys}")
              except Exception as exc:
                  print(f"  {f.name}: 解析失败 {exc}")
          missing = {"ship_data_strengthen", "attribute_info_by_type",
                     "ship_data_trans", "transform_data_template"} - {f.stem for f in files}
          print("缺失：" + (", ".join(sorted(missing)) if missing else "无"))
          PY

      - name: 归档证据
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c scripts32-artifacts
          mkdir -p scripts32
          cp out/* scripts32/ 2>/dev/null || true
          # 4 张表都很小（最大的 attribute_info_by_type 也就几 KB），一起归档便于本地比对
          cp raw32/*.json scripts32/ 2>/dev/null || true
          git add -f scripts32
          if git diff --cached --quiet; then
            echo "没有可提交的证据"
          else
            git commit -m "scripts32: 探针证据 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push -f origin scripts32-artifacts
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scripts32-evidence
          path: |
            out/
            raw32/
          if-no-files-found: warn
