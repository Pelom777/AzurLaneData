name: update-data

# 每小时检查一次版本；只有 azhash 变了才真正解包和构建。
# 只 commit 数据 json（十几 MB），资产不进 git —— 原因见 docs/HANDOFF.md「容量」。
#
# 顺序是刻意的：先握手比版本（几百毫秒），没变就结束。
# 反编译缓存放在版本比对之后，key 用 azhash 的时间戳，
# 这样"没变化的小时"完全不会产生新的 cache 条目，也就不会把 10 GB 配额刷掉。

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      server:
        description: "目标服务器"
        default: CN
        type: choice
        options: [CN, EN, JP, KR, TW]
      force:
        description: "忽略版本比对，强制全量重解"
        default: false
        type: boolean
      dry_run:
        description: "只跑不提交（验证用）"
        default: false
        type: boolean

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

env:
  SERVER: ${{ inputs.server || 'CN' }}
  PYTHONUNBUFFERED: "1"
  # 与 update-assets.yml 同一套 remote 配置，不落任何配置文件
  RCLONE_CONFIG_R2_TYPE: s3
  RCLONE_CONFIG_R2_PROVIDER: Cloudflare
  RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  RCLONE_CONFIG_R2_REGION: auto

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4

      # bcdec / uabdec 是**静态链接**的 32 位 i386 ELF（无 PT_INTERP），
      # 实测在 ubuntu-24.04 上直接就能跑，不需要 libc6:i386。
      # 原来那步 apt install 是多余的，删掉省 40 秒，也少一个失败点。
      - name: 工具链
        run: |
          chmod +x tools/bcdec tools/uabdec
          tools/bcdec </dev/null >/dev/null 2>&1 || echo "bcdec 空输入返回 $? （正常）"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt

      - name: 版本比对
        id: ver
        run: python scripts/check_version.py --server "$SERVER" --state data/version.json

      # 反编译是整个链路里最贵的一步。缓存的 key 是 azhash 的时间戳：
      #   - 版本没变：压根不走这一步（changed=false）
      #   - 版本变了：restore-keys 前缀命中上一版，md5 没变的表直接读缓存
      # 缓存内容按 bundle/TextAsset 的 md5 分文件，所以跨版本复用是安全的。
      - name: 恢复反编译缓存
        if: steps.ver.outputs.changed == 'true' || inputs.force
        uses: actions/cache@v4
        with:
          path: .cache/lua
          key: lua-${{ env.SERVER }}-${{ steps.ver.outputs.stamp }}
          restore-keys: |
            lua-${{ env.SERVER }}-

      - name: 解包 Lua 配置表
        id: unpack
        if: steps.ver.outputs.changed == 'true' || inputs.force
        run: |
          python scripts/unpack_lua.py \
            --server "$SERVER" \
            --out raw \
            --work .cache/work \
            --cache .cache/lua

      - name: 构建 public/data
        id: build
        if: steps.ver.outputs.changed == 'true' || inputs.force
        run: |
          python scripts/build_data.py --raw raw --out public/data

      - name: 契约校验
        id: contract
        if: steps.ver.outputs.changed == 'true' || inputs.force
        run: python scripts/check_data_contract.py --data public/data

      - name: 维护新增台账
        id: track
        if: steps.ver.outputs.changed == 'true' || inputs.force
        run: |
          python scripts/track_new.py \
            --data public/data \
            --version "${{ steps.ver.outputs.version }}"

      # ── 发布到 R2 ──────────────────────────────────────────────
      # 前端只认 cdn.al.pelom.cn（= R2），不读 git。所以数据必须走这一步，
      # 否则"生成了但没人能读到"。放在 commit 之前：上传失败就不提交，
      # version.json 不前进，下一轮会自动重试。
      #
      # 缓存头必须是短的：图片内容不变可以 immutable，数据一天变几次，
      # 长缓存会让前端在上游更新后仍然读旧值。
      - name: 安装 rclone
        if: steps.contract.outcome == 'success' && inputs.dry_run != true
        run: |
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          unzip -oq /tmp/rclone.zip -d /tmp/rclone
          cp /tmp/rclone/rclone-*/rclone /usr/local/bin/rclone
          chmod +x /usr/local/bin/rclone
          rclone version | head -1

      - name: 检查 R2 凭据
        if: steps.contract.outcome == 'success' && inputs.dry_run != true
        run: |
          missing=""
          [ -z "$RCLONE_CONFIG_R2_ACCESS_KEY_ID" ] && missing="$missing R2_ACCESS_KEY_ID"
          [ -z "$RCLONE_CONFIG_R2_SECRET_ACCESS_KEY" ] && missing="$missing R2_SECRET_ACCESS_KEY"
          [ -z "${{ secrets.R2_ACCOUNT_ID }}" ] && missing="$missing R2_ACCOUNT_ID"
          [ -z "${{ secrets.R2_BUCKET }}" ] && missing="$missing R2_BUCKET"
          if [ -n "$missing" ]; then
            echo "::error::缺少 secrets:$missing（配置方法见 docs/CDN.md §5.1）"
            exit 1
          fi
          echo "凭据齐全，桶 = ${{ secrets.R2_BUCKET }}"

      - name: 发布 data 到 R2
        if: steps.contract.outcome == 'success' && inputs.dry_run != true
        run: |
          # --checksum：本地 mtime 每次构建都变，按 size+mtime 会重复上传
          # --s3-no-check-bucket：R2 对受限 token 的 HeadBucket 返回 403
          rclone copy public/data "r2:${{ secrets.R2_BUCKET }}/data" \
            --checksum \
            --s3-no-check-bucket \
            --transfers 8 --checkers 8 \
            --header-upload "Cache-Control: public, max-age=300, stale-while-revalidate=60" \
            --stats 5s --stats-one-line
          rclone lsf "r2:${{ secrets.R2_BUCKET }}/data" --files-only | sort > /tmp/r2-data.lst
          echo "远端 data/ 现有 $(wc -l < /tmp/r2-data.lst) 个对象"
          cat /tmp/r2-data.lst

      - name: 记录版本
        if: steps.ver.outputs.changed == 'true' || inputs.force
        run: python scripts/check_version.py --server "$SERVER" --state data/version.json --write

      # 只有契约校验真的跑过且通过才提交：
      # 没变化的小时里 contract 是 skipped，就不会产生空提交。
      - name: 提交
        if: steps.contract.outcome == 'success' && inputs.dry_run != true
        run: |
          python scripts/commit.py \
            --paths public/data data/version.json data/new-ledger.json \
            --message "data: ${{ env.SERVER }} ${{ steps.ver.outputs.version }}"

      - name: 摘要
        if: always()
        run: |
          {
            echo "## 数据更新 · $SERVER"
            echo ""
            echo "- 版本：\`${{ steps.ver.outputs.version }}\`（变化：\`${{ steps.ver.outputs.changed }}\`）"
            echo "- 解包：\`${{ steps.unpack.outputs.tables || '-' }}\` 张表 / \`${{ steps.unpack.outputs.entries || '-' }}\` 条 / 失败 \`${{ steps.unpack.outputs.failed || 0 }}\` / \`${{ steps.unpack.outputs.seconds || '-' }}\` 秒"
            echo "- 新增：船 \`${{ steps.track.outputs.new_ships || 0 }}\` 皮肤 \`${{ steps.track.outputs.new_skins || 0 }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
