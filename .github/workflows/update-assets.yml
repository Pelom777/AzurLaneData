name: update-assets

# 资源链路的**唯一**入口。热更新和全量重建不需要人区分 —— prep job 先盘点
# 「state 里有多少资源已过期或缺失」，再按每片 400 个算出要分几片。
# 热更新盘出来是几十个 → 1 片；全量是几千个 → 6~7 片。人不用管。
#
# 为什么合并（2026-10-22）
# ----------------------
# 合并前有两个 workflow：sync-assets（热更新）和 regen-assets（全量）。
# 两者有 6 个步骤逐字重复，但更糟的是**语义相反**：
#   sync-assets  传了 `--seed`
#   regen-assets 刻意不传
# `--seed` 的语义是「远端有对象、state 没记录 → 只补记录、不下载」，
# 等于断言「托管上那份就是最新版」。全量重建之所以不用它，是因为这个断言
# 无法验证 —— 官方若换过图，seed 之后会永久停在旧版且不报错。
# 同一个 state 文件在两个入口得到相反结论，是一颗迟早会踩的雷。
# 现在统一为：**默认不用 seed**，需要时用 `seed=true` 显式打开，
# 并且只该用在一件事上：把已由别的途径入库的存量资产接进台账。
#
# 分片（唯一与环境相关的那部分）
# ------------------------------
# 热更新一次只动几十个资源，单 job 几分钟跑完。
# 全量重建约 2,491 张 / 下载 3.7 GB / 产物 5.6 GB，托管 runner 的 / 只有
# 约 14 GB，单 job 峰值 9.3 GB 且中途无法回收 —— 必须按 crc32(名字) % N
# 切成 N 片，每片跑完立刻上传丢弃。分片键用 crc32 而不是 hash()：
# 后者按进程随机化，换一次进程分片就飘了。
#
# 分几片由 prep 的盘点结果算：ceil(pending / 400)，上限 16。
# 400 这个数按 painting 标定（单张约 1.5 MB 下载 + 3.3 MB 产物 ≈ 4.8 MB，
# 400 个 ≈ 1.9 GB 峰值）。想强制指定就填 shards=1..16，0 表示自动。
#
# 「以后更新时也能用」靠的是 state 继承，不是每次重跑
# --------------------------------------------------
# 每个分片先 `cp .azl/assets-state.json .azl/state-N.json` 继承基线，
# 再配合 mark_remote 把「远端已有对象」翻译成本地 marker。判据仍是原本那一条
# （state 的 md5 一致 **且** 产物在磁盘），语义不变：
#   · 首次      state 里没有 → 全部重新生成
#   · 之后      只有官方改过的（md5 变了）才重做
#
# 前置：public/data 必须是**当前版本**的数据。它决定 --scope used 的引用集，
#   数据旧了会漏掉新船（实测旧 16 个月的数据漏 333 张立绘）。

on:
  workflow_dispatch:
    inputs:
      items:
        description: "资源类别（空格分隔）"
        default: "painting squareicon shipicon equipicon iconframe"
        type: string
      shards:
        description: "分片数：0=按待处理量自动决定（默认）；1..16=强制指定"
        default: "0"
        type: string
      scope:
        description: "used=只导 public/data 引用到的；all=清单全导"
        default: used
        type: choice
        options: [used, all]
      limit:
        description: "每类每片最多处理几个（0 = 不限。调管路时用它把成本压到最小）"
        default: "0"
        type: string
      seed:
        description: "远端有、state 无记录时只补台账不重下。仅用于一次性迁移存量"
        default: false
        type: boolean
      force:
        description: "忽略 state 里已存在的 md5，连未变化的也重做"
        default: false
        type: boolean
      dry_run:
        description: "只生成，不拉远端、不上传、不提交"
        default: false
        type: boolean
      refresh_headers:
        description: "一次性：只把桶里所有 *.json 的 Cache-Control 刷成 300s，不做生成"
        default: false
        type: boolean
      prune:
        description: "一次性：删掉指定的立绘目录（空格分隔的名字，不含 painting/ 前缀）"
        default: ""
        type: string

concurrency:
  group: update-assets
  cancel-in-progress: false

permissions:
  contents: write

env:
  SERVER: CN
  PYTHONUNBUFFERED: "1"
  RCLONE_CONFIG_R2_TYPE: s3
  RCLONE_CONFIG_R2_PROVIDER: Cloudflare
  RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  RCLONE_CONFIG_R2_REGION: auto

jobs:
  # 先盘点再决定分几片 —— 这样"热更新还是全量"不再需要人来判断。
  #
  # 盘点走的是与正式运行**完全相同**的枚举与过滤（azl_assets.py --plan 就是
  # 主循环里的一个分支），所以这个数不会和实际工作量漂移。
  # 判据是"state 里的 md5 与当前清单不一致"；刻意不看产物是否在磁盘 ——
  # CI 是干净 checkout，带上那一半判据会把已是最新的资源全算成待处理。
  # 拿到的是**下界**：远端对象丢失也会产生真实工作量，但那属于自愈，不该影响分片。
  #
  # 这个 job 不装任何第三方依赖：azl_assets.py 的 cv2 / UnityPy 都是函数内导入，
  # 盘点模式走不到。整个 job 约 20 秒。
  prep:
    if: ${{ !inputs.refresh_headers && inputs.prune == '' }}
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.decide.outputs.shards }}
      n: ${{ steps.decide.outputs.n }}
      pending: ${{ steps.plan.outputs.pending }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 盘点待处理量
        id: plan
        run: |
          ARGS="--plan --server $SERVER --public public --cache .azl/bundles \
                --state .azl/assets-state.json --scope ${{ inputs.scope }} \
                --items ${{ inputs.items }}"
          # force 意味着"全部重做"，此时盘点也不该走 state 缓存
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python scripts/azl_assets.py $ARGS

      - name: 决定分片数
        id: decide
        run: |
          PENDING="${{ steps.plan.outputs.pending }}"
          OVERRIDE="${{ inputs.shards }}"
          # 每片 400 个是按 painting 标定的：单张约 1.5 MB 下载 + 3.3 MB 产物，
          # 400 个 ≈ 1.9 GB 峰值，安全落在 runner 的 14 GB 磁盘内（阈值取 6 GB）。
          PER_SHARD=400
          case "$OVERRIDE" in
            ''|0) N=$(( (PENDING + PER_SHARD - 1) / PER_SHARD )) ;;
            *[!0-9]*) echo "::error::shards 必须是非负整数，收到 '$OVERRIDE'"; exit 1 ;;
            *) N="$OVERRIDE" ;;
          esac
          [ "$N" -lt 1 ] && N=1
          if [ "$N" -gt 16 ]; then
            echo "::warning::算出 $N 片，超过上限 16，按 16 跑（每片约 $((PENDING / 16)) 个）"
            N=16
          fi
          echo "shards=$(python3 -c 'import json,sys;print(json.dumps(list(range(int(sys.argv[1])))))' "$N")" >> "$GITHUB_OUTPUT"
          echo "n=$N" >> "$GITHUB_OUTPUT"
          echo "待处理 $PENDING 个 → $N 片（每片上限 $PER_SHARD 个）"
          {
            echo "### 盘点"
            echo
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 待处理（state 过期或缺失） | **$PENDING** |"
            echo "| 已是最新 | ${{ steps.plan.outputs.up_to_date }} |"
            echo "| 分片数 | **$N** |"
          } >> "$GITHUB_STEP_SUMMARY"

  assets:
    needs: prep
    if: ${{ !inputs.refresh_headers && inputs.prune == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      # 一片失败不要把其他片也掐掉：成功的片段仍有价值（state 会记录），
      # 下次 dispatch 就少做一片。
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prep.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt
          python -c "import cv2, numpy, UnityPy; print('cv2', cv2.__version__, '| numpy', numpy.__version__, '| UnityPy', UnityPy.__version__)"

      - name: 安装 rclone
        if: ${{ !inputs.dry_run }}
        run: |
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          unzip -oq /tmp/rclone.zip -d /tmp/rclone
          cp /tmp/rclone/rclone-*/rclone /usr/local/bin/rclone
          chmod +x /usr/local/bin/rclone
          rclone version | head -1

      - name: 检查 R2 凭据
        if: ${{ !inputs.dry_run }}
        run: |
          missing=""
          [ -z "$RCLONE_CONFIG_R2_ACCESS_KEY_ID" ] && missing="$missing R2_ACCESS_KEY_ID"
          [ -z "$RCLONE_CONFIG_R2_SECRET_ACCESS_KEY" ] && missing="$missing R2_SECRET_ACCESS_KEY"
          [ -z "${{ secrets.R2_ACCOUNT_ID }}" ] && missing="$missing R2_ACCOUNT_ID"
          [ -z "${{ secrets.R2_BUCKET }}" ] && missing="$missing R2_BUCKET"
          if [ -n "$missing" ]; then
            echo "::error::缺少 secrets:$missing（配置方法见 docs/CDN.md §5.1）"
            exit 1
          fi
          echo "凭据齐全，桶 = ${{ secrets.R2_BUCKET }}"

      # 各片自行拉清单。桶 listing 一次约几秒，比起把它做成 artifact 在多个 job
      # 之间搬来搬去更简单，也避免了 download-artifact 对单文件路径的处理差异。
      # 并行片之间不会互相干扰：crc32 分片保证每片只碰自己那批名字。
      - name: 拉取远端对象清单
        if: ${{ !inputs.dry_run }}
        run: |
          mkdir -p .azl
          # --recursive 不能省：rclone lsf 默认只列一层，而产物全在 <item>/ 子目录下。
          # 不加这句列出来永远是空的，mark_remote 会静默失效（已经踩过一次）。
          if ! rclone lsf "r2:${{ secrets.R2_BUCKET }}" --files-only --recursive > .azl/remote.lst; then
            echo "::error::读不到桶 ${{ secrets.R2_BUCKET }}（先按 docs/CDN.md §4.0 建桶，"
            echo "::error::并确认 token 有 Object Read & Write 权限）"
            exit 1
          fi
          echo "远端已有 $(wc -l < .azl/remote.lst) 个对象"

      # 干净 checkout 里 public/<item>/ 被 .gitignore 挡在外面，判据的第二个条件
      # （产物文件存在）恒为假。远端存在同名对象就是它的等价证据。
      - name: 补齐本地 marker
        if: ${{ !inputs.dry_run }}
        run: python scripts/mark_remote.py --listing .azl/remote.lst --public public

      # 继承基线 state：这是「以后还能用」的关键。
      # 若各片从空 state 起手，每次 dispatch 都会全量重解一遍。
      - name: 准备分片 state
        run: |
          [ -f .azl/assets-state.json ] || echo '{}' > .azl/assets-state.json
          python - <<'PY'
          import json, shutil
          src = '.azl/assets-state.json'
          dst = '.azl/state-${{ matrix.shard }}.json'
          d = json.load(open(src, encoding='utf-8'))
          items = d.get('items') or {}
          desc = ', '.join('%s=%d' % (k, len(v)) for k, v in items.items()) or '空'
          print(f'基线 state：{desc}（共 {sum(len(v) for v in items.values())} 条）')
          shutil.copyfile(src, dst)
          print(f'已复制为分片 state：{dst}')
          PY

      # 磁盘先体检再开跑。跑到一半写满是最难查的失败：表现是 cv2 报 IO 错、
      # 或者 png 只有半张，看不出是容量问题。
      - name: 磁盘预检
        run: |
          free=$(df -Pm / | awk 'NR==2{print $4}')
          echo "分片 ${{ matrix.shard }} 开始前可用 ${free} MB"
          if [ "$free" -lt 6000 ]; then
            echo "::error::可用磁盘 ${free} MB < 6 GB，跑一片就会写满。调大 shards 或换更大的 runner。"
            exit 1
          fi

      - name: 生成（分片 ${{ matrix.shard }}）
        id: gen
        run: |
          SHARD="${{ matrix.shard }}"
          N="${{ needs.prep.outputs.n }}"
          ARGS="--server $SERVER --public public --cache .azl/bundles \
                --state .azl/state-$SHARD.json --scope ${{ inputs.scope }} \
                --items ${{ inputs.items }} --shard $SHARD/$N \
                --report-files .azl/written-$SHARD.list \
                --report-failures .azl/failed-$SHARD.json"
          if [ "${{ inputs.limit }}" != "0" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          # seed 默认关。打开它等于断言「远端那份就是最新版」，无法验证，
          # 只应在一次性迁移存量资产时临时打开（见文件头部说明）。
          if [ "${{ inputs.seed }}" = "true" ]; then ARGS="$ARGS --seed"; fi
          echo "python scripts/azl_assets.py $ARGS"
          start=$(date +%s)
          python scripts/azl_assets.py $ARGS
          echo "耗时 $(( $(date +%s) - start ))s"

      # 用 copy 不用 sync：sync 会删远端多余对象（spine 是手工搬的，不在任何一次
      # 生成的清单里，会被一并删掉）。--ignore-times：清单已是精确变更集。
      # --s3-no-check-bucket：R2 对受限 token 的 HeadBucket 返回 403，rclone 会
      # 误判桶不存在并尝试 CreateBucket，然后整体失败。
      #
      # 两类对象、两种 TTL（2026-10-22）：
      #   *.json   索引文件，前端靠它决定去取哪些图层。内容一变就必须尽快生效，
      #            所以跟 data 链路一致用 300s。
      #   其余      图片 / mesh，路径里没有内容 hash，改了也只能是"短一点的长缓存"，
      #            取 86400。
      # 之前 json 也是 86400：删掉 shop_hx 图层之后，已经拿过旧 json 的浏览器
      # 最长要 24h 才换新版，这期间一直去请求已被删除的 shop_hx.png（404）。
      - name: 上传（分片 ${{ matrix.shard }}）
        if: ${{ !inputs.dry_run }}
        run: |
          SHARD="${{ matrix.shard }}"
          tr '\0' '\n' < ".azl/written-$SHARD.list" | sed 's|^public/||' | sed '/^$/d' \
            > ".azl/upload-$SHARD.lst"
          n=$(wc -l < ".azl/upload-$SHARD.lst")
          echo "分片 $SHARD 待上传 $n 个对象"
          if [ "$n" -eq 0 ]; then echo "清单为空，跳过上传"; exit 0; fi

          grep '\.json$' ".azl/upload-$SHARD.lst" > ".azl/upload-$SHARD.json.lst" || true
          grep -v '\.json$' ".azl/upload-$SHARD.lst" > ".azl/upload-$SHARD.bin.lst" || true

          upload() {
            local lst="$1" cc="$2" c
            c=$(wc -l < "$lst")
            if [ "$c" -eq 0 ]; then echo "  跳过（0 个）：$lst"; return 0; fi
            echo "  上传 $c 个 → Cache-Control: $cc"
            rclone copy public "r2:${{ secrets.R2_BUCKET }}" \
              --files-from "$lst" \
              --ignore-times \
              --s3-no-check-bucket \
              --transfers 16 --checkers 32 \
              --header-upload "Cache-Control: $cc" \
              --stats 15s --stats-one-line
          }
          upload ".azl/upload-$SHARD.json.lst" "public, max-age=300, stale-while-revalidate=60"
          upload ".azl/upload-$SHARD.bin.lst"  "public, max-age=86400"

      - name: 上报分片账目
        if: always()
        run: |
          shard="${{ matrix.shard }}"
          lst=".azl/upload-$shard.lst"
          if [ -f "$lst" ]; then queued=$(wc -l < "$lst"); else queued=-; fi
          disk=$(df -Pm / | awk 'NR==2{print $4}')
          out=$(du -sm public 2>/dev/null | awk '{print $1}')
          {
            echo "### 分片 $shard/${{ needs.prep.outputs.n }}"
            echo
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 新增 / 变更 / 失败 | ${{ steps.gen.outputs.new || '-' }} / ${{ steps.gen.outputs.changed_count || '-' }} / ${{ steps.gen.outputs.failed || '-' }} |"
            echo "| 写出文件 | ${{ steps.gen.outputs.files || '-' }} |"
            echo "| 待上传对象 | ${queued} |"
            echo "| public/ 体积 | ${out:-?} MB |"
            echo "| 残留可用磁盘 | ${disk} MB |"
          } >> "$GITHUB_STEP_SUMMARY"

      # 每片单独落一个 state + 一份账目 —— N 个 job 各写各的，最后在 merge 里合成。
      # 不能共用同一个文件：并行 job 无法互相看见改动，后写完的会盖掉先写完的。
      #
      # 传目录而不是单文件：upload-artifact 对单文件路径的处理会保留目录前缀，
      # 取回来就变成 .azl/states/.azl/state-N.json，合并时 glob 找不到会直接失败。
      # 目录作为根时内容会被摊平，落点才是确定的。
      - name: 打包分片产物
        if: ${{ !inputs.dry_run }}
        run: |
          mkdir -p .azl/frag
          cp ".azl/state-${{ matrix.shard }}.json" ".azl/frag/state-${{ matrix.shard }}.json"
          # 失败名单可能不存在：--plan 不会跑到生成，清单为空的片也不会写文件。
          # 但文件必须存在 —— 下面 upload-artifact 设了 if-no-files-found: error，
          # 而且 merge 那头是 glob 汇总，缺一片就会静默少算。
          if [ -f ".azl/failed-${{ matrix.shard }}.json" ]; then
            cp ".azl/failed-${{ matrix.shard }}.json" ".azl/frag/failed-${{ matrix.shard }}.json"
          else
            echo '{"failures": []}' > ".azl/frag/failed-${{ matrix.shard }}.json"
          fi
          cat > ".azl/frag/report-${{ matrix.shard }}.json" <<EOF
          {"shard": ${{ matrix.shard }},
           "new": ${{ steps.gen.outputs.new || 0 }},
           "changed": ${{ steps.gen.outputs.changed_count || 0 }},
           "failed": ${{ steps.gen.outputs.failed || 0 }},
           "files": ${{ steps.gen.outputs.files || 0 }},
           "written": ${{ steps.gen.outputs.written || 0 }}}
          EOF
          ls -l .azl/frag

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.dry_run }}
        with:
          name: shard-${{ matrix.shard }}
          path: .azl/frag
          retention-days: 3
          if-no-files-found: error

  # 把各片 state 合成一份并提交。state 进 git 是增量链路的前提：下一轮
  # 靠它判断"这个资源我已经按哪个 md5 生成过了"。
  merge:
    needs: [prep, assets]
    if: ${{ !inputs.dry_run && !inputs.refresh_headers && inputs.prune == '' && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 取回各片产物
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          merge-multiple: true
          path: .azl/states

      # 合并规则要小心：每个片段都是从**同一份基线**复制出来的，所以它里面既有
      # 本片真正处理过的 key，也有照抄来的基线值。直接按顺序 union 的话，
      # 排在后面的片段会用旧的基线值覆盖前面片段刚算出的新值。
      #
      # 所以按 key 做差分：只有「与基线不同」的那个值才是本片的新成果。
      # 若同一个 key 冒出两个不同的新值，说明分片键漂了，保守保留基线并报警。
      - name: 合并 state 与账目
        id: merge
        run: |
          python - <<'PY'
          import glob, json

          BASE = '.azl/assets-state.json'
          base = json.load(open(BASE, encoding='utf-8'))
          base.setdefault('items', {})
          frags = sorted(glob.glob('.azl/states/state-*.json'))
          if not frags:
              raise SystemExit('::error::没有任何 state 片段，拒绝合并（生成环节大概全挂了）')

          diff = {}
          for p in frags:
              frag = json.load(open(p, encoding='utf-8'))
              for srv, items in (frag.get('items') or {}).items():
                  bmap = base['items'].setdefault(srv, {})
                  for k, v in items.items():
                      if bmap.get(k) == v:
                          continue
                      diff.setdefault((srv, k), {}).setdefault(v, []).append(p)

          applied = conflicted = 0
          for (srv, k), vals in diff.items():
              if len(vals) == 1:
                  base['items'][srv][k] = next(iter(vals))
                  applied += 1
              else:
                  print(f'::warning::key {srv}:{k} 出现 {len(vals)} 个冲突值，保留基线')
                  conflicted += 1

          for p in frags:
              frag = json.load(open(p, encoding='utf-8'))
              for srv, ver in (frag.get('version') or {}).items():
                  base.setdefault('version', {})[srv] = ver

          json.dump(base, open(BASE, 'w', encoding='utf-8'),
                    ensure_ascii=False, indent=1, sort_keys=True)
          total = sum(len(v) for v in base['items'].values())
          print(f'片段 {len(frags)} 个 → 应用 {applied} 条，冲突 {conflicted} 条')
          print(f'state 现有 {total} 条：' +
                ', '.join(f'{k}={len(v)}' for k, v in base['items'].items()))

          # 账目也在这里汇总，供提交信息与摘要使用
          tot = {'new': 0, 'changed': 0, 'failed': 0, 'files': 0, 'written': 0}
          for p in sorted(glob.glob('.azl/states/report-*.json')):
              r = json.load(open(p, encoding='utf-8'))
              for k in tot:
                  tot[k] += int(r.get(k) or 0)
          print('合计：新增 %d / 变更 %d / 失败 %d / 写出文件 %d'
                % (tot['new'], tot['changed'], tot['failed'], tot['files']))
          with open('.azl/total.env', 'w', encoding='utf-8') as fh:
              for k, v in tot.items():
                  fh.write(f'{k}={v}\n')

          # 失败名单跨片汇总。以前只有 failed=N 这一个数字，日志一滚就查不到
          # 是哪个资源、为什么。落一份文本给下一步贴进摘要。
          # 口径提醒：失败项刻意不写 state，所以下一轮会自己重试 ——
          # 这份名单是"这一轮谁没过"，不是"永久失败清单"。
          rows = []
          for p in sorted(glob.glob('.azl/states/failed-*.json')):
              d = json.load(open(p, encoding='utf-8'))
              for f in (d.get('failures') or []):
                  # 异常信息里可能有换行 / 制表符 / 竖线：换行会撕坏下面的 TSV，
                  # 竖线会撕坏摘要里的 markdown 表格，一律压成单空格。
                  reason = ' '.join(str(f.get('reason', '')).split()).replace('|', r'\|')
                  rows.append((f.get('item', '?'), f.get('path', '?'),
                               int(f.get('size') or 0), reason))
          with open('.azl/failures.txt', 'w', encoding='utf-8') as fh:
              for item, path, size, reason in rows:
                  fh.write(f'{item}\t{path}\t{size}\t{reason}\n')
          print(f'失败名单 {len(rows)} 条 → .azl/failures.txt')
          # 大量失败时（上游挂了会一次几百个）别把 warning 刷满整页
          for item, path, size, reason in rows[:20]:
              print(f'::warning::{item} {path} 失败：{reason}')
          if len(rows) > 20:
              print(f'::warning::另有 {len(rows) - 20} 条失败，见摘要表格')
          PY
          cat .azl/total.env >> "$GITHUB_OUTPUT"

      - name: 失败名单
        run: |
          f=.azl/failures.txt
          if [ ! -f "$f" ] || [ ! -s "$f" ]; then
            echo "本轮无失败资源" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          n=$(wc -l < "$f")
          {
            echo "### 失败资源 $n 个"
            echo
            echo "| 类别 | 资源 | 包大小 | 原因 |"
            echo "|---|---|---|---|"
            # 摘要里全列：这里不是日志，滚动条比缺失信息好。
            while IFS=$'\t' read -r item path size reason; do
              echo "| $item | \`$path\` | $size B | $reason |"
            done < "$f"
            echo
            echo "失败项不写 state，下一轮 dispatch 会自动重试。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 提交 state
        run: |
          if git diff --quiet -- .azl/assets-state.json; then
            echo "state 无变化，跳过提交"
            exit 0
          fi
          python scripts/commit.py --paths .azl/assets-state.json \
            --message "assets: 新增 ${{ steps.merge.outputs.new }} / 变更 ${{ steps.merge.outputs.changed }}（${{ needs.prep.outputs.n }} 片）"

      - name: 摘要
        if: always()
        run: |
          {
            echo "## update-assets"
            echo
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 类别 | \`${{ inputs.items }}\` |"
            echo "| 待处理 / 分片 | ${{ needs.prep.outputs.pending }} / ${{ needs.prep.outputs.n }} |"
            echo "| scope / limit / seed / force | ${{ inputs.scope }} / ${{ inputs.limit }} / ${{ inputs.seed }} / ${{ inputs.force }} |"
            echo "| 新增 / 变更 / 失败 | ${{ steps.merge.outputs.new || '-' }} / ${{ steps.merge.outputs.changed || '-' }} / ${{ steps.merge.outputs.failed || '-' }} |"
            echo "| 写出文件 | ${{ steps.merge.outputs.files || '-' }} |"
            echo "| 待上传（所有分片合计） | ${{ steps.merge.outputs.written || '-' }} |"
            echo "| dry-run | ${{ inputs.dry_run }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # 一次性补救（2026-10-22）：桶里已有的 *.json 是 86400 上传的，改代码只影响
  # 之后的新对象，历史对象的元数据不会自己变。所以拉下来再传回去，把头改掉。
  # json 只有几百字节，2.5k 个来回也就几 MB，比重新生成便宜几个数量级。
  # 不做生成、不动 state —— 纯元数据操作，随时可以再跑一次。
  headers:
    if: ${{ inputs.refresh_headers }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 安装 rclone
        run: |
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          unzip -oq /tmp/rclone.zip -d /tmp/rclone
          cp /tmp/rclone/rclone-*/rclone /usr/local/bin/rclone
          chmod +x /usr/local/bin/rclone
          rclone version | head -1

      - name: 取回所有 json
        run: |
          mkdir -p _hdr
          rclone copy "r2:${{ secrets.R2_BUCKET }}" _hdr \
            --include "*.json" \
            --s3-no-check-bucket \
            --transfers 32 --checkers 32 \
            --stats 15s --stats-one-line
          echo "取回 $(find _hdr -name '*.json' | wc -l) 个 json，共 $(du -sh _hdr | awk '{print $1}')"

      - name: 用 300s 的头传回去
        run: |
          n=$(find _hdr -name '*.json' | wc -l)
          if [ "$n" -eq 0 ]; then echo "::error::没取回任何 json，拒绝继续"; exit 1; fi
          rclone copy _hdr "r2:${{ secrets.R2_BUCKET }}" \
            --include "*.json" \
            --ignore-times \
            --s3-no-check-bucket \
            --transfers 32 --checkers 32 \
            --header-upload "Cache-Control: public, max-age=300, stale-while-revalidate=60" \
            --stats 15s --stats-one-line

      - name: 抽查
        run: |
          for p in painting/baifeng_2/baifeng_2.json; do
            curl -sI "https://pub-85b4b8af407244bc8f1502127fc530c3.r2.dev/$p" | grep -i "cache-control\|^HTTP"
          done

  # 删资源用。为什么单开一个入口而不是顺手在某个 job 里删：
  #   · 生成链路是**增量**的，state 里没有的才会去做；已经不收录的资源它根本不会碰，
  #     所以存量不会随着"规则改了"而自动消失（_hx 那次就是这个教训）。
  #   · 删除是这里唯一不可逆的操作，必须能单独跑、单独看清楚它要删什么。
  #
  # 顺序有硬依赖：**先在数据侧剔除，再回来清资源**。
  # 脚本会拿 public/data 的引用集挡一道 —— 名字还被引用就直接拒绝，
  # 免得删出线上缺图。
  #
  # 用法：先跑一次不带 apply 的（下面第一步就是），看完对象数与体积再决定。
  prune:
    if: ${{ inputs.prune != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 rclone
        run: |
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          unzip -oq /tmp/rclone.zip -d /tmp/rclone
          cp /tmp/rclone/rclone-*/rclone /usr/local/bin/rclone
          chmod +x /usr/local/bin/rclone
          rclone version | head -1

      - name: 检查 R2 凭据
        run: |
          missing=""
          [ -z "$RCLONE_CONFIG_R2_ACCESS_KEY_ID" ] && missing="$missing R2_ACCESS_KEY_ID"
          [ -z "$RCLONE_CONFIG_R2_SECRET_ACCESS_KEY" ] && missing="$missing R2_SECRET_ACCESS_KEY"
          [ -z "${{ secrets.R2_ACCOUNT_ID }}" ] && missing="$missing R2_ACCOUNT_ID"
          [ -z "${{ secrets.R2_BUCKET }}" ] && missing="$missing R2_BUCKET"
          if [ -n "$missing" ]; then
            echo "::error::缺少 secrets:$missing（配置方法见 docs/CDN.md §5.1）"
            exit 1
          fi

      # 先列一遍：看到的是"真要删掉多少东西"，不是脚本自说自话。
      # 空目录（0 个对象）也算通过 —— 那种情况只需要清台账。
      - name: 预览
        id: preview
        run: |
          python scripts/prune_assets.py \
            --data public/data \
            --state .azl/assets-state.json \
            --names ${{ inputs.prune }}

      # 预览里被引用集挡下的话，上一步已经 die 了，走不到这里。
      - name: 执行删除并清台账
        id: do
        run: |
          python scripts/prune_assets.py \
            --data public/data \
            --state .azl/assets-state.json \
            --bucket "${{ secrets.R2_BUCKET }}" \
            --apply \
            --names ${{ inputs.prune }}

      - name: 验证已删
        run: |
          for n in ${{ inputs.prune }}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
              "https://pub-85b4b8af407244bc8f1502127fc530c3.r2.dev/painting/$n/$n.json")
            echo "$n → HTTP $code（期望 404）"
          done

      - name: 提交 state
        run: |
          if git diff --quiet -- .azl/assets-state.json; then
            echo "state 无变化，跳过提交"
            exit 0
          fi
          python scripts/commit.py --paths .azl/assets-state.json \
            --message "chore(assets): 删掉 ${{ steps.do.outputs.pruned || 0 }} 个资源目录（${{ steps.do.outputs.objects || 0 }} 个对象）"

      - name: 摘要
        if: always()
        run: |
          {
            echo "## 资源清理"
            echo
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 立绘 | ${{ inputs.prune }} |"
            echo "| 删除对象 / 体积 | ${{ steps.do.outputs.objects || 0 }} / $(( ${{ steps.do.outputs.bytes || 0 }} / 1048576 )) MB |"
            echo "| 清理台账 | ${{ steps.do.outputs.keys || 0 }} 条 |"
          } >> "$GITHUB_STEP_SUMMARY"
